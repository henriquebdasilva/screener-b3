name: Screener B3 diário

on:
  schedule:
    # 22:00 UTC = 19:00 BRT (após o fechamento da B3), de segunda a sexta.
    - cron: "17 22 * * 1-5"
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
    inputs:
      universe:
        description: "Universo (ibov | smll | both)"
        default: "both"
      q_bluechip:
        description: "Fração superior — blue chips / BOVA11 (ex.: 0.60)"
        default: "0.60"
      q_smallcap:
        description: "Fração superior — small caps / SMALL11 (ex.: 0.50)"
        default: "0.50"
      q_defensive:
        description: "Fração superior — defensivas (ex.: 0.70)"
        default: "0.70"

permissions:
  contents: write           # necessário para commitar os relatórios de volta

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar screener
        env:
          UNIVERSE: ${{ github.event.inputs.universe || 'both' }}
          QBLUE:  ${{ github.event.inputs.q_bluechip  || '0.60' }}
          QSMALL: ${{ github.event.inputs.q_smallcap  || '0.50' }}
          QDEF:   ${{ github.event.inputs.q_defensive || '0.70' }}
          # E-mail (configure em Settings -> Secrets and variables -> Actions)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # IA (tese) e demais opcionais
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          AI_MAX_CALLS: ${{ secrets.AI_MAX_CALLS }}
          AI_MAX_TOKENS: ${{ secrets.AI_MAX_TOKENS }}
          AI_SLEEP: ${{ secrets.AI_SLEEP }}
          AI_DEBUG: ${{ secrets.AI_DEBUG }}
          SELIC: ${{ secrets.SELIC }}
          INSIDER_CHECK: ${{ secrets.INSIDER_CHECK }}
          BASILEIA_DEBUG: ${{ secrets.BASILEIA_DEBUG }}
          PATTERN_DEBUG: ${{ secrets.PATTERN_DEBUG }}
        run: |
          python screener.py --universe "$UNIVERSE" \
            --q-bluechip "$QBLUE" --q-smallcap "$QSMALL" --q-defensive "$QDEF" \
            --no-volume --no-trend \
            --breakout-consol-pct 12 --breakout-margin-pct 0 \
            --min-marketcap 700

      - name: Commitar relatórios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "Sem mudanças nos relatórios."
          else
            git commit -m "screener: relatório de $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Publicar como artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
